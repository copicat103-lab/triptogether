<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripTogether</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fa;
  color:#263246;
}
.container{max-width:900px;margin:auto;padding:16px}
header{
  background:linear-gradient(135deg,#5969d9,#8295ff);
  color:white;padding:25px;border-radius:20px;margin-bottom:16px
}
h1{margin:0 0 8px}
.card{
  background:white;padding:18px;border-radius:16px;
  margin-bottom:15px;box-shadow:0 2px 10px #00000008
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
input,select,button{
  width:100%;padding:12px;border-radius:10px;
  border:1px solid #dce1ea;font-size:16px;margin-top:6px
}
button{
  border:none;background:#6577e8;color:white;
  font-weight:bold;cursor:pointer
}
button.secondary{background:#eef0ff;color:#5665d7}
button.danger{background:#ffecec;color:#d44}
.stat{
  background:#eef0ff;border-radius:12px;padding:15px
}
.stat strong{font-size:22px;display:block;margin-top:6px}
.expense{
  border-bottom:1px solid #eee;padding:12px 0
}
.expense:last-child{border:none}
.small{font-size:13px;color:#7a8495}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{width:auto;padding:8px 12px;font-size:13px}
.person{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid #eee
}
.balance{padding:10px;background:#f7f8fc;border-radius:10px;margin:8px 0}
.green{color:#15945a}
.red{color:#d64c4c}
#rateStatus{font-size:13px;color:#68758a}
</style>
</head>

<body>
<div class="container">

<header>
<h1>✈️ TripTogether</h1>
<p>Общие расходы путешествия</p>
<div id="tripDates"></div>
</header>

<div class="card">
<h2>⚙️ Настройки поездки</h2>

<div class="grid">
<div>
<label>Название поездки</label>
<input id="tripName" value="Thailand Trip">
</div>

<div>
<label>Основная валюта</label>
<select id="baseCurrency">
<option value="KZT">KZT — тенге</option>
</select>
</div>
</div>

<button onclick="saveSettings()">Сохранить настройки</button>
<p id="rateStatus">💱 Загружаем курсы валют...</p>
<button class="secondary" onclick="updateRates()">🔄 Обновить курсы</button>
</div>

<div class="card">
<h2>👥 Участники</h2>
<div id="peopleList"></div>

<div class="grid">
<div>
<label>Имя участника</label>
<input id="personName" placeholder="Например, Муж">
</div>
<div>
<label>&nbsp;</label>
<button onclick="addPerson()">Добавить участника</button>
</div>
</div>
</div>

<div class="card">
<h2>➕ Добавить расход</h2>

<input type="hidden" id="editId">

<label>Название расхода</label>
<input id="expenseTitle" placeholder="Например, ужин">

<div class="grid">
<div>
<label>Сумма</label>
<input id="amount" type="number" min="0" step="0.01" placeholder="2500">
</div>

<div>
<label>Валюта</label>
<select id="currency">
<option value="THB">THB — тайский бат 🇹🇭</option>
<option value="KZT">KZT — тенге 🇰🇿</option>
<option value="USD">USD — доллар 🇺🇸</option>
<option value="EUR">EUR — евро 🇪🇺</option>
<option value="RUB">RUB — рубль 🇷🇺</option>
</select>
</div>

<div>
<label>Категория</label>
<select id="category">
<option value="✈️ Билеты">✈️ Билеты</option>
<option value="🏨 Отель">🏨 Отель</option>
<option value="🍜 Еда">🍜 Еда</option>
<option value="🎡 Экскурсии">🎡 Экскурсии</option>
<option value="🛍️ Покупки">🛍️ Покупки</option>
<option value="🎁 Подарки">🎁 Подарки</option>
<option value="🚕 Транспорт">🚕 Транспорт</option>
<option value="📦 Другое">📦 Другое</option>
</select>
</div>

<div>
<label>Дата</label>
<input id="date" type="date">
</div>

<div>
<label>Кто оплатил?</label>
<select id="paidBy"></select>
</div>
</div>

<label>Разделить между</label>
<div id="splitPeople"></div>

<button onclick="saveExpense()" id="saveExpenseButton">Добавить расход</button>
<button class="secondary" onclick="cancelEdit()" id="cancelButton" style="display:none">
Отмена редактирования
</button>

<p id="conversionPreview" class="small"></p>
</div>

<div class="grid">
<div class="stat">
Всего потрачено
<strong id="total">0 ₸</strong>
</div>

<div class="stat">
Количество расходов
<strong id="count">0</strong>
</div>

<div class="stat">
Средний расход
<strong id="average">0 ₸</strong>
</div>

<div class="stat">
Расходов на человека
<strong id="perPerson">0 ₸</strong>
</div>
</div>

<div class="card">
<h2>💰 Баланс участников</h2>
<div id="balances"></div>
</div>

<div class="card">
<h2>🤝 Кто кому должен</h2>
<div id="settlements"></div>
</div>

<div class="card">
<h2>📊 Расходы по категориям</h2>
<div id="categories"></div>
</div>

<div class="card">
<h2>🧾 История расходов</h2>
<div id="history"></div>
<button class="secondary" onclick="exportCSV()">📥 Скачать CSV</button>
</div>

</div>

<script>
const KEY="TripTogether_currency_v1";

let data={
  tripName:"Thailand Trip",
  base:"KZT",
  people:[
    {id:1,name:"Александра"},
    {id:2,name:"Муж"}
  ],
  expenses:[],
  rates:{KZT:1},
  rateDate:"",
  nextId:3
};

function load(){
  const saved=localStorage.getItem(KEY);
  if(saved){
    try{data=JSON.parse(saved)}catch(e){}
  }
  if(!data.rates)data.rates={KZT:1};
  if(!data.people)data.people=[];
  if(!data.expenses)data.expenses=[];
  if(!data.nextId)data.nextId=Date.now();
  render();
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
}

function money(n){
  return Number(n||0).toLocaleString("ru-RU",{
    maximumFractionDigits:2
  })+" ₸";
}

function toKZT(amount,currency){
  const rate=data.rates[currency];
  if(!rate)return null;
  return amount/rate;
}

async function updateRates(){
  const status=document.getElementById("rateStatus");
  status.textContent="💱 Загружаем актуальные курсы...";

  try{
    const response=await fetch("https://open.er-api.com/v6/latest/KZT");
    const result=await response.json();

    if(result.result!=="success")throw new Error("Курс не получен");

    data.rates=result.rates;
    data.rates.KZT=1;
    data.rateDate=result.time_last_update_utc||"";
    save();

    status.textContent="✅ Курсы обновлены. "+(result.time_last_update_utc||"");
  }catch(e){
    status.textContent="⚠️ Не удалось обновить курсы. Используем сохранённые курсы.";
  }

  preview();
}

function saveSettings(){
  data.tripName=document.getElementById("tripName").value;
  save();
}

function addPerson(){
  const name=document.getElementById("personName").value.trim();
  if(!name)return;

  data.people.push({id:data.nextId++,name});
  document.getElementById("personName").value="";
  save();
}

function removePerson(id){
  if(data.people.length<=1){
    alert("В поездке должен остаться хотя бы один участник");
    return;
  }

  if(data.expenses.some(e=>e.paidBy===id)){
    alert("Нельзя удалить участника, который уже оплатил расходы.");
    return;
  }

  data.people=data.people.filter(p=>p.id!==id);
  save();
}

function renderPeople(){
  document.getElementById("peopleList").innerHTML=data.people.map(p=>`
    <div class="person">
      <span>${escapeHTML(p.name)}</span>
      <button class="danger" style="width:auto" onclick="removePerson(${p.id})">Удалить</button>
    </div>
  `).join("");

  const paidBy=document.getElementById("paidBy");
  paidBy.innerHTML=data.people.map(p=>
    `<option value="${p.id}">${escapeHTML(p.name)}</option>`
  ).join("");

  document.getElementById("splitPeople").innerHTML=data.people.map(p=>`
    <label style="display:block;padding:8px">
      <input type="checkbox" class="splitCheck" value="${p.id}" checked style="width:auto">
      ${escapeHTML(p.name)}
    </label>
  `).join("");
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function preview(){
  const amount=Number(document.getElementById("amount").value);
  const currency=document.getElementById("currency").value;
  const out=document.getElementById("conversionPreview");

  if(!amount){
    out.textContent="";
    return;
  }

  const converted=toKZT(amount,currency);

  if(converted===null){
    out.textContent="⚠️ Курс "+currency+" пока не загружен";
  }else{
    out.textContent=`≈ ${money(converted)} по текущему курсу`;
  }
}

function saveExpense(){
  const title=document.getElementById("expenseTitle").value.trim();
  const amount=Number(document.getElementById("amount").value);
  const currency=document.getElementById("currency").value;
  const category=document.getElementById("category").value;
  const date=document.getElementById("date").value;
  const paidBy=Number(document.getElementById("paidBy").value);
  const split=[...document.querySelectorAll(".splitCheck:checked")].map(x=>Number(x.value));

  if(!title||!amount||amount<=0||!date||split.length===0){
    alert("Заполни все поля и выбери участников, между которыми делится расход.");
    return;
  }

  const converted=toKZT(amount,currency);

  if(converted===null){
    alert("Курс валюты не загружен. Нажми «Обновить курсы».");
    return;
  }

  const expense={
    id:document.getElementById("editId").value
      ?Number(document.getElementById("editId").value)
      :data.nextId++,
    title,
    amount,
    currency,
    kzt:converted,
    category,
    date,
    paidBy,
    split
  };

  const editId=document.getElementById("editId").value;

  if(editId){
    data.expenses=data.expenses.map(e=>e.id===Number(editId)?expense:e);
  }else{
    data.expenses.push(expense);
  }

  cancelEdit();
  save();
}

function editExpense(id){
  const e=data.expenses.find(x=>x.id===id);
  if(!e)return;

  document.getElementById("editId").value=e.id;
  document.getElementById("expenseTitle").value=e.title;
  document.getElementById("amount").value=e.amount;
  document.getElementById("currency").value=e.currency;
  document.getElementById("category").value=e.category;
  document.getElementById("date").value=e.date;
  document.getElementById("paidBy").value=e.paidBy;

  document.querySelectorAll(".splitCheck").forEach(c=>{
    c.checked=e.split.includes(Number(c.value));
  });

  document.getElementById("saveExpenseButton").textContent="Сохранить изменения";
  document.getElementById("cancelButton").style.display="block";
  preview();

  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
  document.getElementById("editId").value="";
  document.getElementById("expenseTitle").value="";
  document.getElementById("amount").value="";
  document.getElementById("date").value=new Date().toISOString().slice(0,10);

  document.querySelectorAll(".splitCheck").forEach(c=>c.checked=true);

  document.getElementById("saveExpenseButton").textContent="Добавить расход";
  document.getElementById("cancelButton").style.display="none";
  document.getElementById("conversionPreview").textContent="";
}

function deleteExpense(id){
  if(confirm("Удалить этот расход?")){
    data.expenses=data.expenses.filter(e=>e.id!==id);
    save();
  }
}

function calculateBalances(){
  const balance={};

  data.people.forEach(p=>balance[p.id]=0);

  data.expenses.forEach(e=>{
    balance[e.paidBy]=(balance[e.paidBy]||0)+e.kzt;

    const share=e.kzt/e.split.length;

    e.split.forEach(id=>{
      balance[id]=(balance[id]||0)-share;
    });
  });

  return balance;
}

function renderBalances(){
  const balances=calculateBalances();

  document.getElementById("balances").innerHTML=data.people.map(p=>{
    const b=balances[p.id]||0;
    return `<div class="balance">
      <strong>${escapeHTML(p.name)}</strong><br>
      <span class="${b>=0?"green":"red"}">
      ${b>=0?"Ему/ей должны: ":"Должен/должна: "}${money(Math.abs(b))}
      </span>
    </div>`;
  }).join("");
}

function renderSettlements(){
  const balances=calculateBalances();

  let creditors=[];
  let debtors=[];

  Object.entries(balances).forEach(([id,b])=>{
    if(b>0.01)creditors.push({id:Number(id),amount:b});
    if(b<-0.01)debtors.push({id:Number(id),amount:-b});
  });

  let result=[];

  while(debtors.length&&creditors.length){
    const d=debtors[0];
    const c=creditors[0];
    const amount=Math.min(d.amount,c.amount);

    const debtor=data.people.find(p=>p.id===d.id);
    const creditor=data.people.find(p=>p.id===c.id);

    result.push(`${escapeHTML(debtor.name)} → ${escapeHTML(creditor.name)}: <strong>${money(amount)}</strong>`);

    d.amount-=amount;
    c.amount-=amount;

    if(d.amount<0.01)debtors.shift();
    if(c.amount<0.01)creditors.shift();
  }

  document.getElementById("settlements").innerHTML=result.length
    ?result.map(x=>`<div class="balance">${x}</div>`).join("")
    :"<p>🎉 Все расчёты уравновешены!</p>";
}

function renderCategories(){
  const cats={};

  data.expenses.forEach(e=>{
    cats[e.category]=(cats[e.category]||0)+e.kzt;
  });

  const total=data.expenses.reduce((s,e)=>s+e.kzt,0);

  document.getElementById("categories").innerHTML=
    Object.entries(cats).map(([name,amount])=>{
      const percent=total?amount/total*100:0;
      return `<div class="balance">
        ${name}<br>
        <strong>${money(amount)}</strong>
        <div style="background:#eee;height:8px;border-radius:5px;margin-top:8px">
          <div style="background:#6979e9;width:${percent}%;height:8px;border-radius:5px"></div>
        </div>
      </div>`;
    }).join("")||"<p>Пока расходов нет</p>";
}

function renderHistory(){
  const sorted=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById("history").innerHTML=sorted.map(e=>{
    const person=data.people.find(p=>p.id===e.paidBy);
    return `<div class="expense">
      <strong>${escapeHTML(e.title)}</strong><br>
      <span>${e.category} • ${e.date}</span><br>
      <strong>${e.amount.toLocaleString("ru-RU")} ${e.currency}</strong>
      <span class="small">≈ ${money(e.kzt)}</span><br>
      <span class="small">Оплатил: ${escapeHTML(person?.name||"")}</span>
      <div class="actions">
        <button class="secondary" onclick="editExpense(${e.id})">Редактировать</button>
        <button class="danger" onclick="deleteExpense(${e.id})">Удалить</button>
      </div>
    </div>`;
  }).join("")||"<p>Расходов пока нет</p>";
}

function render(){
  document.getElementById("tripName").value=data.tripName||"";
  document.getElementById("tripDates").textContent="";
  document.getElementById("date").value=
    document.getElementById("date").value||new Date().toISOString().slice(0,10);

  renderPeople();

  const total=data.expenses.reduce((s,e)=>s+e.kzt,0);

  document.getElementById("total").textContent=money(total);
  document.getElementById("count").textContent=data.expenses.length;
  document.getElementById("average").textContent=
    money(data.expenses.length?total/data.expenses.length:0);
  document.getElementById("perPerson").textContent=
    money(data.people.length?total/data.people.length:0);

  renderBalances();
  renderSettlements();
  renderCategories();
  renderHistory();
}

document.getElementById("amount").addEventListener("input",preview);
document.getElementById("currency").addEventListener("change",preview);

load();
updateRates();
</script>
</body>
</html>
